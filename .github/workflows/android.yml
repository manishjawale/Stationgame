name: Build Android app

on:
  workflow_dispatch:        # Actions tab -> "Build Android app" -> Run workflow
  push:
    tags: ['v*']            # or push a tag like v1.0.1

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: |
          npm run libs
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#f6c21c' --splashBackgroundColor '#f6c21c'
          npx cap sync android
          node scripts/patch-android.js
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}

      - name: Set version (versionCode = 100 + run number)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode $((100 + ${{ github.run_number }}))/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "applicationId|versionCode|versionName" android/app/build.gradle

      - name: Build test APK (install on your phone)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Build signed release bundle (.aab for Play Console)
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cd android && ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Download - test APK
        uses: actions/upload-artifact@v4
        with:
          name: next-station-test-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Download - Play Store bundle
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: next-station-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
